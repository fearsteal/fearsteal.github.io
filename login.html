<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | FearSteal</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><div class="auth-box"><img class="auth-logo" src="assets/logo.png" alt="FearSteal"><h1>Welcome Back</h1><p class="auth-sub">Sign in to your FearSteal account</p><form id="loginForm"><div class="field"><label>Username or Email</label><input name="identity" autocomplete="username" required placeholder="Enter username or email"></div><div class="field"><label>Password</label><div style="display:flex;gap:8px"><input id="loginPass" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"><button type="button" class="btn" data-toggle-password="#loginPass">Show</button></div></div><div class="row"><label class="check"><input type="checkbox"> Remember me</label><a class="small-link" href="#" onclick="FS.toast('Password reset will be connected to the real auth provider later.');return false">Forgot password?</a></div><button class="btn primary full" type="submit">LOGIN</button></form><div id="message" class="message"></div><p style="text-align:center;color:var(--muted);margin-top:20px;font-size:14px">No account? <a class="small-link" href="register.html">Create one</a></p></div></main><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
