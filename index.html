    // --- TIME AGO DYNAMIC FORMATTER ---
    const formatTimeAgo = (timestamp) => {
      if (!timestamp) return "Just now";
      const now = Date.now();
      const diffMs = now - timestamp;
      const diffSecs = Math.floor(diffMs / 1000);
      const diffMins = Math.floor(diffSecs / 60);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffSecs < 60) return "Just now";
      if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
      if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
      return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    };

    // --- SOUND SYNTHESIZER ---
    const playSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(560, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'copy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'admin') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.linearRampToValueAtTime(700, now + 0.15);
          osc.frequency.linearRampToValueAtTime(1050, now + 0.3);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'staff') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'crate') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }

    // --- REAL MINECRAFT BEDROCK/JAVA + VELOCITY STATUS API HOOK (1-Min Auto Poll) ---
    const useMinecraftStatus = (ip = "play.fearsteal.fun", port = 19132) => {
      const [status, setStatus] = useState({
        online: false,
        players: { online: 0, max: 500 },
        version: "1.20.x - 1.21.x",
        software: "Velocity / Bedrock Proxy",
        motd: "⚔️ FEARSTEAL LIFESTEAL NETWORK | Steal Hearts, Rule the World",
        ping: 22,
        lastUpdated: null,
        loading: true,
        rawStatus: 'loading',
        refreshSecondsRemaining: 60
      });

      const fetchStatus = async () => {
        try {
          let isOnline = false;
          let pOnline = 0;
          let pMax = 500;
          let sVersion = "1.20.x - 1.21.x (Velocity/Bedrock)";
          let sSoftware = "Velocity Proxy / Paper LifeSteal Core";
          let sMotd = "FearSteal LifeSteal Network • Season 1 Official";
          let sPing = Math.floor(Math.random() * 6) + 19;

          try {
            const res = await fetch(`https://api.mcstatus.io/v2/status/bedrock/${ip}:${port}`, { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (data && data.online !== undefined) {
                isOnline = data.online;
                if (isOnline) {
                  pOnline = data.players?.online || 0;
                  pMax = data.players?.max || 500;
                  sVersion = data.version?.name || sVersion;
                  sSoftware = "Velocity Proxy / Geyser Bedrock";
                  sMotd = data.motd?.clean || sMotd;
                }
              }
            }
          } catch (e) {
            const fb = await fetch(`https://api.mcsrvstat.us/bedrock/3/${ip}:${port}`);
            if (fb.ok) {
              const fbData = await fb.json();
              isOnline = fbData.online || false;
              if (isOnline) {
                pOnline = fbData.players?.online || 0;
                pMax = fbData.players?.max || 500;
                sVersion = fbData.version || sVersion;
                sSoftware = "Velocity Core Engine";
                if (fbData.motd?.clean) sMotd = fbData.motd.clean.join(' ');
              }
            }
          }

          setStatus({
            online: isOnline,
            players: { online: pOnline, max: pMax },
            version: isOnline ? sVersion : "Unavailable",
            software: isOnline ? sSoftware : "Offline (Awaiting Proxy Handshake)",
            motd: isOnline ? sMotd : "Server is currently offline or undergoing maintenance.",
            ping: sPing,
            lastUpdated: new Date().toLocaleTimeString(),
            loading: false,
            rawStatus: isOnline ? 'online' : 'offline',
            refreshSecondsRemaining: 60
          });
        } catch (err) {
          setStatus(prev => ({
            ...prev,
            online: false,
            loading: false,
            lastUpdated: new Date().toLocaleTimeString(),
            rawStatus: 'unknown',
            refreshSecondsRemaining: 60
          }));
        }
      };

      useEffect(() => {
        fetchStatus();
        const pollInterval = setInterval(fetchStatus, 60000);
        const tickInterval = setInterval(() => {
          setStatus(prev => ({
            ...prev,
            refreshSecondsRemaining: prev.refreshSecondsRemaining > 1 ? prev.refreshSecondsRemaining - 1 : 60
          }));
        }, 1000);

        return () => {
          clearInterval(pollInterval);
          clearInterval(tickInterval);
        };
      }, [ip, port]);

      return { status, refresh: fetchStatus };
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // 1. Boot Sequence
      const [bootProgress, setBootProgress] = useState(0);

                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="xl:hidden p-2.5 rounded-xl bg-dark-800 border border-white/10 text-gray-300 hover:text-white"
                >
                  <Icon name={mobileMenuOpen ? "x" : "menu"} size={20} />
                </button>
              </div>
            </div>

            {/* Mobile Nav Menu */}
            {mobileMenuOpen && (
              <div className="xl:hidden bg-dark-900 border-b border-crimson-500/30 px-4 py-6 space-y-1.5">
                {isSuperAdmin && (
                  <button
                    onClick={() => {
                      setMobileMenuOpen(false);
                      setShowAdminPanel(true);
                      playSound('admin');
                    }}
                    className="block w-full text-left px-4 py-2.5 rounded-xl font-gaming font-black text-sm text-black bg-yellow-500 shadow-glow-gold mb-2"
                  >
                    👑 FOUNDER ADMIN SUITE
                  </button>
                )}

                {[
                  { id: 'home', label: 'HOME' },
                  { id: 'status', label: 'SERVER STATUS' },
                  { id: 'members', label: 'MEMBERS DIRECTORY' },
                  { id: 'store', label: 'STORE / RANKS' },
                  { id: 'staff', label: 'STAFF DIRECTORY' },
                  { id: 'leaderboard', label: '10M LEADERBOARD' },
                  { id: 'events', label: 'EVENTS & ROTATION' },
                  { id: 'simulator', label: 'HEART FORGE SIMULATOR' },
                  { id: 'crates', label: 'CRATE UNBOXER (24H)' },
                  { id: 'suggestions', label: 'SERVER SUGGESTIONS' },
                  { id: 'staff-apply', label: 'STAFF APPLICATION' },
                  { id: 'discord-support', label: 'DISCORD & SUPPORT' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => authUser ? navigateTo(item.id) : handleBlockedAccessAttempt()}
                    className="block w-full text-left px-4 py-2.5 rounded-xl font-gaming font-bold text-sm text-gray-200 hover:bg-yellow-500/20 hover:text-white"
                  >
                    {item.label}
                  </button>
                ))}
                <div className="pt-4 border-t border-white/10">
                  <button
                    onClick={copyServerIP}
                    className="w-full py-2.5 px-4 rounded-xl bg-crimson-600/30 border border-crimson-500 text-center font-bold text-xs text-white"
                  >
                    COPY SERVER IP (play.fearsteal.fun)
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* ========================================================================= */}
          {/* HERO SECTION WITH 24-HOUR LIVE HOME SCREEN ANNOUNCEMENTS */}
          {/* ========================================================================= */}
          <section id="home" className="relative pt-8 pb-20 md:pt-14 md:pb-28 overflow-hidden">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
              
              <div className="inline-flex items-center gap-3 px-4 py-2 rounded-full glass-panel-glow mb-8">
                <span className={`w-2.5 h-2.5 rounded-full ${
                  serverStatus.rawStatus === 'online' ? 'bg-emerald-400' :
                  serverStatus.rawStatus === 'offline' ? 'bg-crimson-500' :
                  'bg-yellow-400'
                }`}></span>
                <span className="text-xs font-gaming font-bold tracking-widest uppercase text-gray-200">
                  {serverStatus.rawStatus === 'online' ? '🟢 SERVER ONLINE' :
                   serverStatus.rawStatus === 'offline' ? '🔴 SERVER OFFLINE' : '⚠️ STATUS UNKNOWN'}
                </span>
                <span className="text-xs text-gray-500">|</span>
                <span className="text-xs font-mono font-bold text-yellow-400">
                  {serverStatus.rawStatus === 'online' 
                    ? `${serverStatus.players.online}/${serverStatus.players.max} Players`
                    : 'Port: 19132'}
                </span>
              </div>

              {/* LIVE 24-HOUR HOME SCREEN BROADCASTS WITH DYNAMIC TIME AGO */}
              {homeActiveAnnouncements.length > 0 && (
                <div className="max-w-4xl mx-auto mb-8 space-y-3">
                  {homeActiveAnnouncements.map((ann) => (
                    <div key={ann.id} className="p-4 sm:p-5 rounded-3xl bg-dark-900/95 border-2 border-yellow-500/60 shadow-glow-gold text-left flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                      <div className="space-y-1 flex-1">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="px-2.5 py-0.5 rounded-full bg-yellow-500 text-black font-black text-[10px] font-gaming uppercase tracking-wider">
                            📢 LIVE 24H BROADCAST
                          </span>
                          <span className="text-xs font-bold text-white font-gaming uppercase tracking-wider">
                            {ann.title}
                          </span>
                          <span className="text-[10px] text-yellow-400 font-mono font-bold">
                            ({formatTimeAgo(ann.createdAt)})
                          </span>
                        </div>
                        <p className="text-xs text-gray-300 leading-relaxed font-mono">
                          {ann.body}
                        </p>
                        <p className="text-[10px] text-yellow-400 font-mono font-bold pt-1">
                          ✍️ {ann.authorSignature}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* SUPPLIED HERO BANNER */}
              <div className="max-w-5xl mx-auto mb-10">
                <FearStealBanner />
              </div>

              <p className="mt-4 text-xl sm:text-2xl md:text-3xl font-bold font-gaming tracking-widest text-gray-300 max-w-4xl mx-auto">
                THE NEXT GENERATION <span className="text-crimson-400">LIFESTEAL</span> NETWORK
              </p>

              <p className="mt-3 text-sm sm:text-base text-gray-400 max-w-2xl mx-auto leading-relaxed">
                Dominate intense PvP combat, steal hearts from conquered foes, outsmart enemy clans in 15-day automated tournaments, and experience zero-latency Bedrock & Java gameplay.
              </p>

              <div className="mt-8 flex flex-wrap items-center justify-center gap-4 max-w-2xl mx-auto">
                <button
                  onClick={copyServerIP}
                  className="group relative flex-1 min-w-[220px] py-4 px-6 rounded-2xl bg-gradient-to-r from-crimson-600 via-crimson-600 to-crimson-700 hover:from-crimson-500 text-white font-gaming font-bold text-lg tracking-wider uppercase shadow-glow-crimson transition-all flex items-center justify-center gap-3"
                >
                  <Icon name="copy" size={20} />
                  <span>COPY SERVER IP</span>
                </button>

                <a
                  href="https://discord.gg/pGM5x3gXpX"
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={() => playSound('click')}
                  className="flex-1 min-w-[180px] py-4 px-6 rounded-2xl bg-[#5865F2]/20 hover:bg-[#5865F2]/30 border border-[#5865F2]/60 text-white font-gaming font-bold text-lg tracking-wider uppercase backdrop-blur-md transition-all flex items-center justify-center gap-3 shadow-lg"
                >
                  <Icon name="message-square" size={20} className="text-[#5865F2]" />
                  <span>JOIN DISCORD</span>
                </a>

                <a
                  href="https://store.cryzormc.in/"
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={() => playSound('click')}
                  className="flex-1 min-w-[180px] py-4 px-6 rounded-2xl bg-dark-800/80 hover:bg-dark-800 border border-white/10 hover:border-yellow-500/50 text-white font-gaming font-bold text-lg tracking-wider uppercase backdrop-blur-md transition-all flex items-center justify-center gap-3"
                >
                  <Icon name="shopping-bag" size={20} className="text-yellow-400" />
                  <span>VISIT STORE</span>
                </a>
              </div>

              <div className="mt-12 max-w-3xl mx-auto glass-panel rounded-3xl p-5 sm:p-6 shadow-2xl">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center divide-y md:divide-y-0 md:divide-x divide-white/10">
                  <div className="pt-2 md:pt-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 font-gaming">Server Address</span>
                    <p className="font-mono font-bold text-yellow-400 text-sm mt-1">play.fearsteal.fun</p>
                  </div>
                  <div className="pt-2 md:pt-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 font-gaming">Bedrock Port</span>
                    <p className="font-mono font-bold text-white text-sm mt-1">19132</p>
                  </div>
                  <div className="pt-2 md:pt-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 font-gaming">Version Support</span>
                    <p className="font-mono font-bold text-white text-sm mt-1">{serverStatus.version}</p>
                  </div>
                  <div className="pt-2 md:pt-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 font-gaming">Network Proxy</span>
                    <p className="font-mono font-bold text-emerald-400 text-sm mt-1">Velocity Proxy</p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* FOOTER & STAY UPDATED NEWSLETTER */}
          {/* ========================================================================= */}
          <footer className="bg-dark-950 border-t border-yellow-500/20 pt-16 pb-12 relative">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 mb-12">
                
                <div className="space-y-4">
                  <FearStealLogo />
                  <p className="text-xs text-gray-400 leading-relaxed font-mono">
                    FearSteal is an elite Minecraft LifeSteal network engineered for peak PvP intensity and smooth cross-platform performance.
                  </p>
                  <div className="text-xs text-gray-500 font-mono">
                    <p>IP: <span className="text-white">play.fearsteal.fun</span></p>
                    <p>Port: <span className="text-white">19132</span></p>
                    <p>Support: <a href="mailto:fearstealsupport@gmail.com" className="text-yellow-400 hover:underline">fearstealsupport@gmail.com</a></p>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold uppercase tracking-widest text-yellow-400 mb-4 font-gaming">
                    EXPLORE
                  </h4>
                  <ul className="space-y-2 text-xs text-gray-400 font-gaming">
                    <li><button onClick={() => navigateTo('home')} className="hover:text-white transition-colors">Home Portal</button></li>
                    <li><button onClick={() => navigateTo('status')} className="hover:text-white transition-colors">Server Status & Velocity</button></li>
                    <li><button onClick={() => navigateTo('members')} className="hover:text-white transition-colors">Members Directory</button></li>
                    <li><button onClick={() => navigateTo('store')} className="hover:text-white transition-colors">Server Ranks & Store</button></li>
                    <li><button onClick={() => navigateTo('staff')} className="hover:text-white transition-colors">Staff Directory</button></li>
                    <li><button onClick={() => navigateTo('leaderboard')} className="hover:text-white transition-colors">10m Leaderboards</button></li>
                    <li><button onClick={() => navigateTo('crates')} className="hover:text-white transition-colors">Crate Unboxer (24h)</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-xs font-bold uppercase tracking-widest text-yellow-400 mb-4 font-gaming">
                    OFFICIAL NETWORKS
                  </h4>
                  <ul className="space-y-2 text-xs text-gray-400">
                    <li><a href="https://discord.gg/pGM5x3gXpX" target="_blank" rel="noopener noreferrer" className="hover:text-white flex items-center gap-1.5"><Icon name="message-square" size={14} /> Discord Server</a></li>
                    <li><a href="https://store.cryzormc.in/" target="_blank" rel="noopener noreferrer" className="hover:text-white flex items-center gap-1.5"><Icon name="shopping-bag" size={14} /> Store Portal</a></li>
                    <li><a href="mailto:fearstealsupport@gmail.com" className="hover:text-white flex items-center gap-1.5"><Icon name="mail" size={14} /> Email Support</a></li>
                    <li><button onClick={() => navigateTo('suggestions')} className="hover:text-white flex items-center gap-1.5"><Icon name="lightbulb" size={14} /> Server Suggestions</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-xs font-bold uppercase tracking-widest text-yellow-400 mb-2 font-gaming">
                    STAY UPDATED
                  </h4>
                  <p className="text-xs text-gray-400 mb-4">
                    Subscribe for server announcement alerts, drop parties, and tournament reminders.
                  </p>

                  <form onSubmit={handleNewsletterSubmit} className="space-y-2">
                    <input
                      type="email"
                      required
                      placeholder="Enter your email address"
                      value={newsletterEmail}
                      onChange={(e) => setNewsletterEmail(e.target.value)}
                      className="w-full bg-dark-850 border border-white/10 rounded-2xl px-3.5 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500"
                    />
                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-2xl bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 text-black font-gaming font-bold text-xs tracking-wider uppercase transition-all shadow-glow-gold"
                    >
                      {newsletterSuccess ? "✓ SUBSCRIBED!" : "SUBSCRIBE TO ALERTS"}
                    </button>
                  </form>
                </div>
              </div>

              <div className="pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-500 gap-4">
                <p>© {new Date().getFullYear()} FearSteal All Rights Reserved.</p>
                <p className="text-center sm:text-right">
                  Not an official Minecraft product. Not affiliated with Mojang or Microsoft.
                </p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
