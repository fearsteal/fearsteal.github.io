    const playSound = (type = 'click') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'copy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        // Audio policy ignore
      }
    };

    // --- INTERACTIVE PARTICLES HERO CANVAS ---
    const CanvasBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Particle configuration
        const particles = [];
        const count = Math.min(Math.floor(width / 16), 75);

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 3 + 1,
            speedY: - (Math.random() * 0.9 + 0.3),
            speedX: (Math.random() - 0.5) * 0.4,
            opacity: Math.random() * 0.7 + 0.2,
            isHeart: Math.random() > 0.85,
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach((p) => {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < -10) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;

            ctx.save();
            ctx.globalAlpha = p.opacity;
            if (p.isHeart) {
              // Draw micro pixel heart
              ctx.fillStyle = '#ff1a40';
              ctx.shadowColor = '#ff1a40';
              ctx.shadowBlur = 8;
              const s = p.size * 1.5;
              ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
            } else {
              ctx.fillStyle = '#ef4444';
              ctx.shadowColor = '#ef4444';
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0 opacity-45" />;
    };

        state: 'LOADING', // 'ONLINE' | 'OFFLINE' | 'UNKNOWN' | 'LOADING'
        online: false,
        players: { online: 0, max: 500 },
        version: 'Bedrock 1.20+',

        try {

                players: {
                  online: data.players?.online ?? 0,
                  max: data.players?.max ?? 500,

                version: data.version?.name ?? 'Bedrock/Java Hybrid',

                lastUpdated: new Date().toLocaleTimeString(),
                history: [...prev.history.slice(1), data.players?.online ?? 0]

              return;
            }

          // Fallback check on Java API
          const javaRes = await fetch('https://api.mcstatus.io/v2/status/java/play.fearsteal.fun:19132', {
            signal: AbortSignal.timeout(6500)
          });
          
          if (javaRes.ok) {
            const data = await javaRes.json();
            if (data.online) {
              setStatus(prev => ({
                state: 'ONLINE',
                online: true,
                players: {
                  online: data.players?.online ?? 0,
                  max: data.players?.max ?? 500,

                version: data.version?.name_clean ?? '1.20 - 1.21.x',

                ping: Math.floor(Math.random() * 10) + 22,
                lastUpdated: new Date().toLocaleTimeString(),
                history: [...prev.history.slice(1), data.players?.online ?? 0]
              }));
              return;
            }
          }

          // If reachable response returns false online
          setStatus(prev => ({
            ...prev,
            state: 'OFFLINE',
            online: false,
            players: { online: 0, max: 500 },
            lastUpdated: new Date().toLocaleTimeString()

        } catch (err) {

            ...prev,
            state: 'UNKNOWN',
            online: false,
            players: { online: 0, max: 500 },
            lastUpdated: new Date().toLocaleTimeString()
          }));
        }
      };

        fetchStatus();
        const interval = setInterval(fetchStatus, 35000); // refresh every 35s

      const [searchModalOpen, setSearchModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Free Novice Rank State
      const [noviceClaims, setNoviceClaims] = useState(() => {
        const saved = localStorage.getItem('fearsteal_novice_claims');
        return saved ? parseInt(saved, 10) : 48; // starts at reasonable community count
      });
      const [hasClaimedNovice, setHasClaimedNovice] = useState(() => {
        return localStorage.getItem('fearsteal_novice_claimed') === 'true';
      });

      // Rotating 15-Day Event System State
      const [currentEventIndex, setCurrentEventIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState({ days: 14, hours: 21, minutes: 43, seconds: 12 });

      // Live Server Status Hook
      const { status: mcStatus, refresh: refreshMcStatus } = useMinecraftStatus();

      // Show toast helper
      const triggerToast = (msg, icon = '✓') => {
        setToast({ msg, icon });
        setTimeout(() => setToast(null), 3800);
      };

      // Copy IP Helper
      const handleCopyIP = () => {
        playSound('copy');
        navigator.clipboard.writeText('play.fearsteal.fun');
        triggerToast('Server IP copied! (play.fearsteal.fun)', '⚔️');
      };

      // Copy creator description helper
      const handleCopyCreatorTemplate = () => {
        playSound('copy');
        const text = `FEARSTEAL LIFESTEAL NETWORK\n• Server IP: play.fearsteal.fun\n• Server Port: 19132\n• Discord: https://discord.gg/pGM5x3gXpX\n• Webstore: https://store.cryzormc.in/\n• Join today and steal their hearts!`;
        navigator.clipboard.writeText(text);
        triggerToast('Creator description template copied to clipboard!', '📹');
      };

      // Handle Novice Claim
      const handleClaimNovice = () => {
        playSound('click');
        if (hasClaimedNovice) {
          triggerToast('You have already claimed this rank. You cannot claim this free rank again ❌️', '⚠️');
          return;
        }

        if (noviceClaims >= 100) {
          triggerToast('Rank is currently OUT OF STOCK (100/100 claimed).', '🔴');
          return;
        }

        // Increment count and mark claimed
        const newCount = Math.min(100, noviceClaims + 1);
        setNoviceClaims(newCount);
        setHasClaimedNovice(true);
        localStorage.setItem('fearsteal_novice_claims', newCount.toString());
        localStorage.setItem('fearsteal_novice_claimed', 'true');

        playSound('success');
        triggerToast('Redirecting to Discord to activate Novice rank! Claim registered.', '🎉');
        setTimeout(() => {
          window.open('https://discord.gg/pGM5x3gXpX', '_blank');
        }, 1200);
      };

      // 15-Day Countdown Timer simulation
      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
            if (prev.minutes > 0) return { ...prev, minutes: 59, seconds: 59 };
            if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
            if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };

            // Rotate event when hitting 0
            setCurrentEventIndex(curr => (curr + 1) % EVENT_POOL.length);
            triggerToast('🎉 A new 15-day community event has begun!', '🔥');
            return { days: 14, hours: 23, minutes: 59, seconds: 59 };
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Notification permission requester
      const requestBrowserNotifications = () => {
        playSound('click');
        if (!("Notification" in window)) {
          triggerToast("This browser does not support desktop notification", "ℹ️");
          return;
        }
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            new Notification("FearSteal LifeSteal Network", {
              body: "Push alerts enabled! You will be notified when 15-day tournaments launch.",
              icon: "https://mc-heads.net/avatar/ItzVeltriex/64"
            });
            triggerToast("Browser push notifications successfully enabled!", "🔔");
          } else {
            triggerToast("Notification permission denied or dismissed.", "❌");
          }
        });
      };

      // Auth Handlers
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');

        if (authMode === 'login') {
          if (!authForm.username || !authForm.password) {
            setAuthError('Please fill out all required fields.');
            return;
          }
          const mockUser = {
            username: authForm.username,
            email: authForm.email || `${authForm.username.toLowerCase()}@player.fearsteal.fun`,
            role: authForm.username.toLowerCase() === 'itzveltriex' ? 'Founder' : 'Lifesteal Slayer',
            hearts: 20

          setUser(mockUser);
          if (authForm.remember) {
            localStorage.setItem('fearsteal_user', JSON.stringify(mockUser));
          }
          setShowAuthModal(false);
          playSound('success');
          triggerToast(`Welcome back to FearSteal, ${mockUser.username}!`, '⚔️');
        } else if (authMode === 'register') {
          if (!authForm.username || !authForm.email || !authForm.password) {
            setAuthError('All fields are required for registration.');
            return;
          }
          if (authForm.password !== authForm.confirm) {
            setAuthError('Passwords do not match.');
            return;

          const newUser = {
            username: authForm.username,
            email: authForm.email,
            role: 'Recruit',
            hearts: 10

          setUser(newUser);
          if (authForm.remember) {
            localStorage.setItem('fearsteal_user', JSON.stringify(newUser));

          setShowAuthModal(false);
          playSound('success');
          triggerToast(`Account created! Welcome to FearSteal, ${newUser.username}!`, '🎉');

          if (!authForm.email) {
            setAuthError('Please provide your registered account email.');
            return;
          }
          triggerToast('Password reset instructions sent to your email!', '✉️');
          setAuthMode('login');

      const handleLogout = () => {

        FAQ_LIST.forEach(f => {
          if (f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q)) {
            results.push({ type: 'FAQ', title: f.q, desc: f.a, section: 'faq' });

        STORE_RANKS.forEach(rnk => {
          if (rnk.name.toLowerCase().includes(q)) {
            results.push({ type: 'Rank', title: `${rnk.name} Rank (${rnk.price})`, desc: rnk.perks.join(', '), section: 'store' });
          }
        });

        return results;
      }, [searchQuery]);

                  <svg className="w-3.5 h-3.5 text-crimson-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />

                {/* Auth User or Login Button */}
