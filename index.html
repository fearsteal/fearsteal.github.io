  <style>
    :root {
      --bg-dark: #040407;
      --bg-surface: #0a0a0f;
      --bg-surface-elevated: #12121b;
      --bg-glass: rgba(14, 14, 22, 0.88);
      --border-color: rgba(220, 38, 38, 0.25);
      --border-subtle: rgba(220, 38, 38, 0.22);
      --border-bright: rgba(239, 68, 68, 0.65);
      --border-glow: rgba(239, 68, 68, 0.6);
      --crimson: #dc2626;
      --crimson-glow: #ef4444;
      --crimson-bright: #ff3344;
      --gold-fs: #ffca18;
      --gold-deep: #e59005;
      --emerald-online: #10b981;
      --emerald-glow: #34d399;
      --amber-ping: #f59e0b;
      --red-offline: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --discord-blurple: #5865F2;
      --discord-dark: #2b2d31;
      --discord-darker: #1e1f22;
      --font-display: 'Rajdhani', sans-serif;
      --font-title: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 14px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --rarity-common: #94a3b8;
      --rarity-rare: #3b82f6;
      --rarity-epic: #a855f7;
      --rarity-legendary: #f59e0b;
      --rarity-mythic: #ef4444;
      --rarity-fear: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(220, 38, 38, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(229, 144, 5, 0.10) 0%, transparent 45%),
        linear-gradient(rgba(4, 4, 7, 0.94), rgba(4, 4, 7, 0.98)),
        url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><g fill="%23221313" fill-opacity="0.25"><path d="M0 0h20v20H0V0zm20 20h20v20H20V20z"/></g></svg>');
      background-attachment: fixed;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #040407; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #dc2626, #e59005); border-radius: 4px; }

    #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }

    .smoke-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(circle at 50% 30%, rgba(220, 38, 38, 0.08), transparent 60%),
                  radial-gradient(circle at 75% 70%, rgba(255, 60, 60, 0.04), transparent 50%);
      filter: blur(40px);
      animation: smokeDrift 22s infinite alternate ease-in-out;
    }
    @keyframes smokeDrift {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.08) translate(-20px, 15px); opacity: 0.9; }
      100% { transform: scale(1) translate(25px, -15px); opacity: 0.7; }
    }

    h1, h2, h3, h4, .font-display { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; }
    .crimson-text { color: var(--crimson-glow); text-shadow: 0 0 16px rgba(239, 68, 68, 0.5); }
    .gold-text { color: var(--gold-fs); text-shadow: 0 0 16px rgba(255, 202, 24, 0.5); }

    .brand-title, .hero-title-gradient {
      font-family: var(--font-display);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 15%, #fff176 55%, #ffca18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 202, 24, 0.35));
    }

    .container { max-width: 1360px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 10; }

    .fs-logo-img {
      display: inline-block; object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(255, 180, 0, 0.55));
      transition: transform 0.35s ease, filter 0.35s ease;
      user-select: none;
    }
    .fs-logo-img:hover { transform: scale(1.06); filter: drop-shadow(0 0 26px rgba(255, 60, 60, 0.8)); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-display); font-weight: 800; font-size: 0.95rem;
      text-transform: uppercase; letter-spacing: 1px; padding: 11px 22px;
      border-radius: 8px; cursor: pointer; border: 1px solid transparent;
      transition: var(--transition); text-decoration: none; position: relative;
      overflow: hidden;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #b91c1c, #ef4444, #f59e0b); color: #fff; box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(239, 68, 68, 0.6); }
    .btn-outline { background: rgba(14, 14, 20, 0.85); color: #fff; border-color: var(--border-color); }
    .btn-outline:hover:not(:disabled) { border-color: var(--crimson-glow); background: rgba(220, 38, 38, 0.2); }
    .btn-gold { background: linear-gradient(135deg, #b45309, #f59e0b, #fbbf24); color: #000; font-weight: 900; }
    .btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .btn-discord { background: linear-gradient(135deg, #4f46e5, #5865F2); color: #fff; }

    .glass-card {
      background: rgba(12, 12, 18, 0.88);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 24px; position: relative;
      transition: var(--transition);
    }
    .glass-card:hover { border-color: var(--border-bright); box-shadow: 0 10px 30px rgba(220, 38, 38, 0.2); }

    .section-title-wrap { text-align: center; margin-bottom: 40px; }
    .section-subtitle { font-size: 0.85rem; font-weight: 700; color: var(--gold-fs); letter-spacing: 3px; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .section-title { font-size: clamp(1.8rem, 3.5vw, 2.6rem); font-weight: 800; color: #ffffff; }
    .section-title-wrap::after { content: ''; display: block; width: 60px; height: 3px; background: linear-gradient(90deg, transparent, var(--crimson-glow), transparent); margin: 10px auto 0; }

    /* PRELOADER SCREEN */
    #site-loader {
      position: fixed; inset: 0; background: #020204; z-index: 9999999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #site-loader.fade-out { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    .loader-ring-wrap { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-spinning-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--crimson); border-bottom-color: var(--gold-fs); animation: spinRing 1.4s linear infinite; }
    .loader-spinning-ring-outer { position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed rgba(239, 68, 68, 0.4); animation: spinRingReverse 4s linear infinite; }
    @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spinRingReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    .loader-bar-bg { width: 260px; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(220, 38, 38, 0.3); }
    .loader-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #dc2626, #f59e0b, #ef4444); transition: width 0.08s linear; }
