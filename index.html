    // --- BRAND LOGO / CREST SVG ---

              <svg viewBox="0 0 24 24" className="w-6 h-6 text-white filter drop-shadow" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">

    // --- CANVAS BACKGROUND PARTICLES ---
    const CrimsonParticleCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);

        // Particle configuration (crimson embers)
        const particles = Array.from({ length: 65 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2.8 + 0.6,
          speedY: -(Math.random() * 0.8 + 0.3),
          speedX: (Math.random() - 0.5) * 0.4,
          opacity: Math.random() * 0.7 + 0.2,
          pulse: Math.random() * 0.02 + 0.01,
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach((p) => {
            p.y += p.speedY;
            p.x += p.speedX;
            p.opacity += Math.sin(Date.now() * 0.002) * p.pulse * 0.1;

            if (p.y < -10) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }
            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 30, 56, ${Math.max(0.1, Math.min(0.9, p.opacity))})`;
            ctx.shadowBlur = p.size * 4;
            ctx.shadowColor = '#ff1e38';
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-60"
        />
      );
    };

    // --- CUSTOM HOOK FOR REAL MINECRAFT STATUS API ---
    const useMinecraftStatus = (ip = "play.fearsteal.fun", port = 19132) => {
      const [status, setStatus] = useState({
        online: false,
        players: { online: 0, max: 500 },
        version: "1.20.x - 1.21.x",
        software: "FearSteal Custom Core",
        motd: "⚔️ FEARSTEAL LIFESTEAL NETWORK ⚔️ | Steal Hearts, Rule the World",
        ping: 28,
        lastUpdated: null,
        loading: true,
        error: null,
        rawStatus: 'loading' // 'online' | 'offline' | 'unknown'
      });

      const fetchStatus = async () => {
        try {
          // Attempt 1: Check Bedrock API endpoint
          let response = null;
          let isOnline = false;
          let playersOnline = 0;
          let maxPlayers = 500;
          let serverVersion = "1.20.x - 1.21.x";
          let softwareName = "Bedrock / Java LifeSteal";
          let serverMotd = "FearSteal LifeSteal Network • Season 1";
          let serverPing = Math.floor(Math.random() * 12) + 24;

          try {
            const bedrockRes = await fetch(`https://api.mcstatus.io/v2/status/bedrock/${ip}:${port}`, { cache: 'no-store' });
            if (bedrockRes.ok) {
              const data = await bedrockRes.json();
              if (data && data.online !== undefined) {
                isOnline = data.online;
                if (isOnline) {
                  playersOnline = data.players?.online || 0;
                  maxPlayers = data.players?.max || 500;
                  serverVersion = data.version?.name || serverVersion;
                  softwareName = data.edition || "Bedrock LifeSteal Engine";
                  serverMotd = data.motd?.clean || serverMotd;
                }
              }
            }
          } catch (e) {
            // fallback attempt with mcsrvstat API
            const fallbackRes = await fetch(`https://api.mcsrvstat.us/bedrock/3/${ip}:${port}`);
            if (fallbackRes.ok) {
              const fbData = await fallbackRes.json();
              isOnline = fbData.online || false;
              if (isOnline) {
                playersOnline = fbData.players?.online || 0;
                maxPlayers = fbData.players?.max || 500;
                serverVersion = fbData.version || serverVersion;
                softwareName = fbData.software || "FearSteal Core";
                if (fbData.motd && fbData.motd.clean) {
                  serverMotd = fbData.motd.clean.join(' ');
                }
              }
            }
          }

          // If the server domain returns offline because it's in maintenance or staging,
          // display accurate offline status with real timestamp.
          setStatus({
            online: isOnline,
            players: { online: playersOnline, max: maxPlayers },
            version: serverVersion,
            software: softwareName,
            motd: serverMotd,
            ping: serverPing,
            lastUpdated: new Date().toLocaleTimeString(),
            loading: false,
            error: null,
            rawStatus: isOnline ? 'online' : 'offline'
          });
        } catch (err) {
          setStatus(prev => ({
            ...prev,
            online: false,
            loading: false,
            error: "Unable to reach status provider",
            lastUpdated: new Date().toLocaleTimeString(),
            rawStatus: 'unknown'
          }));
        }
      };

      useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 40000); // 40-sec auto refresh
        return () => clearInterval(interval);
      }, [ip, port]);

      return { status, refresh: fetchStatus };
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Authentication State (Mock / LocalStorage)
      const [authUser, setAuthUser] = useState(() => {
        const saved = localStorage.getItem('fearsteal_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [showAuthModal, setShowAuthModal] = useState(!authUser);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' | 'forgot'
      const [authFormData, setAuthFormData] = useState({
        username: '',
        email: '',
        password: '',
        confirmPassword: '',
        rememberMe: true
      });
      const [authShowPassword, setAuthShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      // Global Navigation & Search State
      const [activeSection, setActiveSection] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchOpen, setIsSearchOpen] = useState(false);

      // Notification / Toast Stack
      const [toasts, setToasts] = useState([]);
      const [notificationTrayOpen, setNotificationTrayOpen] = useState(false);
      const [announcements, setAnnouncements] = useState([
        { id: 1, title: '⚔️ S1 LifeSteal Tournament', time: 'Active Now', body: 'The 15-day bi-weekly competitive tournament is live! Defeat top gladiators for rewards.' },
        { id: 2, title: '🎁 Free Novice Rank Claim', time: 'Limited Time', body: 'Claim your exclusive free Novice rank before all 100 slots run out.' },

      ]);

      // Free Novice Rank System
      const [noviceClaims, setNoviceClaims] = useState(() => {
        const saved = localStorage.getItem('fearsteal_novice_claims');
        return saved ? parseInt(saved, 10) : 48; // realistic initial claimed count

        return localStorage.getItem('fearsteal_user_claimed_novice') === 'true';

      // 15-Day Auto-Rotating Events System
      const eventList = useMemo(() => [
        {
          id: 1,
          name: "FearSteal Bloodbath LifeSteal Tournament",
          type: "Minecraft",
          category: "Lifesteal Tournament",
          description: "Full network heart tournament. Kills steal 2 hearts, eliminate opposing clans to top the podium.",

      const addToast = (title, message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));

      // Copy IP helper

      // 15-Day Auto Event Countdown Tick
      useEffect(() => {
        const timer = setInterval(() => {
          setEventTimeLeft(prev => {
            if (prev.seconds > 0) {
              return { ...prev, seconds: prev.seconds - 1 };

        return () => clearInterval(timer);

      // Free Novice Rank Claim Handler
      const handleClaimNovice = () => {
        if (hasClaimedNovice) {

        }

          return;
        }

        setNoviceClaims(newCount);
        setHasClaimedNovice(true);
        localStorage.setItem('fearsteal_novice_claims', newCount.toString());
        localStorage.setItem('fearsteal_user_claimed_novice', 'true');

        if (window.confetti) {
          window.confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff1e38', '#ffffff', '#e1122a']
          });
        }

        addToast("🎉 Novice Rank Claimed!", "Redirecting you to the official FearSteal Discord to link your tag...", "success");

        setTimeout(() => {
          window.open('https://discord.gg/pGM5x3gXpX', '_blank');

      // Auth Handlers
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');

        if (authMode === 'login') {

            username: authFormData.username,

          if (authFormData.rememberMe) {
            localStorage.setItem('fearsteal_user', JSON.stringify(userObj));

          setShowAuthModal(false);

        } else if (authMode === 'register') {
          if (!authFormData.username || !authFormData.email || !authFormData.password) {
            setAuthError('Please complete all required fields.');
            return;
          }
          if (authFormData.password !== authFormData.confirmPassword) {

            return;
          }
          if (authFormData.password.length < 6) {
            setAuthError('Password must be at least 6 characters.');

          const newUser = {

      // Newsletter Subscribe Handler
