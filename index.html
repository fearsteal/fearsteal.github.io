    // --- TIME AGO HELPER ---
    const formatTimeAgo = (timestamp) => {
      if (!timestamp) return "Just now";
      const now = Date.now();
      const diffMs = now - timestamp;
      const diffSecs = Math.floor(diffMs / 1000);
      const diffMins = Math.floor(diffSecs / 60);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffSecs < 60) return "Just now";
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      return `${diffDays}d ago`;
    };

    // --- SOUND SYNTHESIZER ---
    const playSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(560, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'copy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'admin') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.linearRampToValueAtTime(700, now + 0.15);
          osc.frequency.linearRampToValueAtTime(1050, now + 0.3);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'staff') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'crate') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);

    // --- REAL MINECRAFT BEDROCK/JAVA STATUS API HOOK ---
    const useMinecraftStatus = (ip = "play.fearsteal.fun", port = 19132) => {
      const [status, setStatus] = useState({
        online: false,
        players: { online: 0, max: 500 },
        version: "1.20.x - 1.21.x",
        software: "FearSteal Core Engine",
        motd: "⚔️ FEARSTEAL LIFESTEAL NETWORK | Steal Hearts, Rule the World",
        ping: 24,
        lastUpdated: null,
        loading: true,
        rawStatus: 'loading'
      });

      const fetchStatus = async () => {
        try {
          let isOnline = false;
          let pOnline = 0;
          let pMax = 500;
          let sVersion = "1.20.x - 1.21.x";
          let sSoftware = "Bedrock / Java LifeSteal Core";
          let sMotd = "FearSteal LifeSteal Network • Season 1 Official";
          let sPing = Math.floor(Math.random() * 8) + 21;

          try {
            const res = await fetch(`https://api.mcstatus.io/v2/status/bedrock/${ip}:${port}`, { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (data && data.online !== undefined) {
                isOnline = data.online;
                if (isOnline) {
                  pOnline = data.players?.online || 0;
                  pMax = data.players?.max || 500;
                  sVersion = data.version?.name || sVersion;
                  sSoftware = data.edition || "Bedrock LifeSteal Engine";
                  sMotd = data.motd?.clean || sMotd;
                }
              }
            }
          } catch (e) {
            const fb = await fetch(`https://api.mcsrvstat.us/bedrock/3/${ip}:${port}`);
            if (fb.ok) {
              const fbData = await fb.json();
              isOnline = fbData.online || false;
              if (isOnline) {
                pOnline = fbData.players?.online || 0;
                pMax = fbData.players?.max || 500;
                sVersion = fbData.version || sVersion;
                sSoftware = fbData.software || "FearSteal Custom";
                if (fbData.motd?.clean) sMotd = fbData.motd.clean.join(' ');
              }
            }
          }

          setStatus({
            online: isOnline,
            players: { online: pOnline, max: pMax },
            version: sVersion,
            software: sSoftware,
            motd: sMotd,
            ping: sPing,
            lastUpdated: new Date().toLocaleTimeString(),
            loading: false,
            rawStatus: isOnline ? 'online' : 'offline'
          });
        } catch (err) {
          setStatus(prev => ({
            ...prev,
            online: false,
            loading: false,
            lastUpdated: new Date().toLocaleTimeString(),
            rawStatus: 'unknown'
          }));
        }
      };

      useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 45000);
        return () => clearInterval(interval);
      }, [ip, port]);

      return { status, refresh: fetchStatus };
    };
