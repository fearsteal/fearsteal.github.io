<body class="bg-dark-950 text-gray-100 antialiased selection:bg-crimson-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- SOUND SYNTHESIS ENGINE (Micro-interactions) ---
    const playSound = (type = 'click') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'copy') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'rank') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(640, now + 0.1);
          osc.frequency.linearRampToValueAtTime(960, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    };

    // --- LUCIDE ICON HELPER ---
    const Icon = ({ name, size = 18, className = "", color = "currentColor" }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px; display:inline-block;"></i>`;
          window.lucide.createIcons({
            attrs: { class: className, stroke: color, 'stroke-width': 2 },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, size, className, color]);

      return <span ref={containerRef} className="inline-flex items-center justify-center align-middle flex-shrink-0" />;
    };

    // --- BRAND LOGO / SWORD EMBLEM ---
    const FearStealLogo = ({ size = "default", className = "" }) => {
      const isLarge = size === "large";
      return (
        <div className={`flex items-center gap-3 select-none ${className}`}>
          <div className="relative flex items-center justify-center">
            <div className="absolute inset-0 bg-crimson-600 rounded-xl blur-md opacity-70 animate-pulse"></div>
            <div className={`relative ${isLarge ? 'w-14 h-14' : 'w-10 h-10 md:w-11 md:h-11'} rounded-xl bg-gradient-to-br from-crimson-500 via-crimson-700 to-black p-0.5 border border-crimson-400 shadow-glow-crimson flex items-center justify-center`}>
              <svg viewBox="0 0 24 24" className={`${isLarge ? 'w-8 h-8' : 'w-6 h-6'} text-white filter drop-shadow`} fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="#ff102f" fillOpacity="0.45" />
                <path d="M12 3v18" stroke="#fff" />
                <path d="M8 7l8 8" stroke="#fff" />
                <path d="M16 7l-8 8" stroke="#fff" />
              </svg>
            </div>
          </div>
          
          <div className="flex flex-col leading-none">
            <div className="flex items-center">
              <span className={`font-gaming font-black ${isLarge ? 'text-4xl' : 'text-2xl md:text-3xl'} tracking-wider text-white`}>
                FEAR<span className="text-crimson-500 text-glow-crimson">STEAL</span>
              </span>
            </div>
            <span className="text-[9px] md:text-[10px] font-bold tracking-[0.28em] text-gray-400 uppercase">
              LIFESTEAL NETWORK
            </span>
          </div>
        </div>
      );
    };

    // --- INTERACTIVE NEURAL & CRIMSON PARTICLE CANVAS ---
    const NeuralCrimsonCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);

        let mouse = { x: null, y: null, radius: 140 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        // Embers & Star Network Particles
        const particleCount = Math.min(80, Math.floor((width * height) / 16000));
        const particles = Array.from({ length: particleCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2.4 + 0.6,
          speedY: -(Math.random() * 0.7 + 0.2),
          speedX: (Math.random() - 0.5) * 0.4,
          opacity: Math.random() * 0.7 + 0.2,
          pulse: Math.random() * 0.02 + 0.01,
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Draw particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;

            // Mouse Repulsion & Connect Lines
            if (mouse.x && mouse.y) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                p.x -= (dx / dist) * force * 3;
                p.y -= (dy / dist) * force * 3;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 16, 47, ${p.opacity})`;
            ctx.shadowBlur = p.size * 5;
            ctx.shadowColor = '#ff102f';
            ctx.fill();

            // Connect nearby nodes
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 100) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(255, 16, 47, ${0.15 * (1 - dist / 100)})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-60" />;
    };

    // --- 3D INTERACTIVE TILT CONTAINER HOOK ---
    const useTilt = () => {
      const ref = useRef(null);

      const handleMouseMove = (e) => {
        const card = ref.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -7;
        const rotateY = ((x - centerX) / centerX) * 7;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      };

      const handleMouseLeave = () => {
        const card = ref.current;
        if (!card) return;
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
      };

      return { ref, onMouseMove: handleMouseMove, onMouseLeave: handleMouseLeave };
    };

    // --- MINECRAFT SERVER STATUS HOOK ---
    const useMinecraftStatus = (ip = "play.fearsteal.fun", port = 19132) => {
      const [status, setStatus] = useState({
        online: false,
        players: { online: 0, max: 500 },
        version: "1.20.x - 1.21.x",
        software: "FearSteal Core Engine",
        motd: "⚔️ FEARSTEAL LIFESTEAL NETWORK | Steal Hearts, Rule the World",
        ping: 24,
        lastUpdated: null,
        loading: true,
        rawStatus: 'loading'
      });

      const fetchStatus = async () => {
        try {
          let isOnline = false;
          let pOnline = 0;
          let pMax = 500;
          let sVersion = "1.20.x - 1.21.x";
          let sSoftware = "Bedrock / Java LifeSteal";
          let sMotd = "FearSteal LifeSteal Network • Season 1 Official";
          let sPing = Math.floor(Math.random() * 8) + 21;

          try {
            const res = await fetch(`https://api.mcstatus.io/v2/status/bedrock/${ip}:${port}`, { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              if (data && data.online !== undefined) {
                isOnline = data.online;
                if (isOnline) {
                  pOnline = data.players?.online || 0;
                  pMax = data.players?.max || 500;
                  sVersion = data.version?.name || sVersion;
                  sSoftware = data.edition || "Bedrock Core Engine";
                  sMotd = data.motd?.clean || sMotd;
                }
              }
            }
          } catch (e) {
            const fb = await fetch(`https://api.mcsrvstat.us/bedrock/3/${ip}:${port}`);
            if (fb.ok) {
              const fbData = await fb.json();
              isOnline = fbData.online || false;
              if (isOnline) {
                pOnline = fbData.players?.online || 0;
                pMax = fbData.players?.max || 500;
                sVersion = fbData.version || sVersion;
                sSoftware = fbData.software || "FearSteal Custom";
                if (fbData.motd?.clean) sMotd = fbData.motd.clean.join(' ');
              }
            }
          }

          setStatus({
            online: isOnline,
            players: { online: pOnline, max: pMax },
            version: sVersion,
            software: sSoftware,
            motd: sMotd,
            ping: sPing,
            lastUpdated: new Date().toLocaleTimeString(),
            loading: false,
            rawStatus: isOnline ? 'online' : 'offline'
          });
        } catch (err) {
          setStatus(prev => ({
            ...prev,
            online: false,
            loading: false,
            lastUpdated: new Date().toLocaleTimeString(),
            rawStatus: 'unknown'
          }));
        }
      };

      useEffect(() => {
        fetchStatus();
        const interval = setInterval(fetchStatus, 45000);
        return () => clearInterval(interval);
      }, [ip, port]);

      return { status, refresh: fetchStatus };
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // Intro Boot Sequence (Cool entered transition)
      const [bootLoaded, setBootLoaded] = useState(false);

      // Auth State
      const [authUser, setAuthUser] = useState(() => {
        const saved = localStorage.getItem('fearsteal_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [showAuthModal, setShowAuthModal] = useState(!authUser);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' | 'forgot'
      const [authFormData, setAuthFormData] = useState({ username: '', email: '', password: '', confirmPassword: '', rememberMe: true });
      const [authShowPassword, setAuthShowPassword] = useState(false);
      const [authError, setAuthError] = useState('');

      // Global Nav & Modals
      const [activeSection, setActiveSection] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [selectedRankModal, setSelectedRankModal] = useState(null);

      // Notification / Toast Stack
      const [toasts, setToasts] = useState([]);
      const [notificationTrayOpen, setNotificationTrayOpen] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Free Novice Rank Claim Tracker (0-100 max)
      const [noviceClaims, setNoviceClaims] = useState(() => {
        const saved = localStorage.getItem('fearsteal_novice_claims');
        return saved ? parseInt(saved, 10) : 56;
      });
      const [hasClaimedNovice, setHasClaimedNovice] = useState(() => {
        return localStorage.getItem('fearsteal_user_claimed_novice') === 'true';
      });

      // 15-Day Auto-Rotating Events
      const eventList = useMemo(() => [
        {
          id: 1,
          name: "FearSteal Bloodbath LifeSteal Tournament",
          type: "Minecraft",
          category: "Lifesteal Tournament",
          description: "Full network heart combat tournament. Kills grant double hearts! Knock out clans to conquer the #1 Hall of Fame.",
          reward: "1x FEARSTEAL Rank + $50 Store Voucher + Custom In-Game Aura"
        },
        {
          id: 2,
          name: "Imperial KOTH Castle Siege",
          type: "Minecraft",
          category: "KOTH Event",
          description: "Dominate and hold the central WarZone citadel for 10 consecutive minutes against server-wide assault.",
          reward: "Full God Netherite Kit + STEAL+ Rank Voucher"
        },
        {
          id: 3,
          name: "Community Clip & Montage Championship",
          type: "Discord",
          category: "Community Challenge",
          description: "Share your top FearSteal clutch kills on TikTok & YouTube with our official creator description template.",
          reward: "KING Rank + Exclusive Media Kit Producer Role"
        },
        {
          id: 4,
          name: "Mythic Wither Incursion & Boss Hunt",
          type: "Minecraft",
          category: "Boss Fight",
          description: "Summoned World Boss in the Nether Warzone. Deal the highest DPS to harvest pristine heart canisters.",
          reward: "15x Extra Heart Tokens + 5x Mythic Keys"
        }
      ], []);

      const [currentEventIndex, setCurrentEventIndex] = useState(0);
      const [eventTimeLeft, setEventTimeLeft] = useState({ days: 11, hours: 18, minutes: 42, seconds: 15 });

      // Live Server Status
      const { status: serverStatus, refresh: refreshServerStatus } = useMinecraftStatus("play.fearsteal.fun", 19132);

      // Trigger Boot Sequence on Mount
      useEffect(() => {
        const timer = setTimeout(() => {
          setBootLoaded(true);
        }, 1100);
        return () => clearTimeout(timer);
      }, []);

      // Scroll Reveal Intersection Observer
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('reveal-visible');
              }
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -50px 0px' }
        );

        const elements = document.querySelectorAll('.reveal-on-scroll');
        elements.forEach((el) => observer.observe(el));

        return () => observer.disconnect();
      }, [bootLoaded]);

      // Sound Wrapper
      const triggerSound = (type) => {
        if (soundEnabled) playSound(type);
      };

      // Toast dispatch helper
      const addToast = (title, message, type = 'info') => {
        const id = Date.now();
        triggerSound(type === 'error' ? 'click' : 'copy');
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4500);
      };

      // Copy IP Action
      const copyServerIP = (e) => {
        if (e) e.stopPropagation();
        navigator.clipboard.writeText("play.fearsteal.fun:19132");
        triggerSound('copy');
        addToast("✓ Server IP Copied!", "play.fearsteal.fun (Port: 19132) copied to clipboard.", "success");
      };

      // 15-Day Auto-Rotation Interval
      useEffect(() => {
        const timer = setInterval(() => {
          setEventTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
