    // --- CANVAS PARTICLES COMPONENT ---
    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        const particleCount = Math.min(Math.floor(width / 18), 75);

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2.8 + 0.8,
            speedY: Math.random() * -1.2 - 0.3, // rises like red embers
            speedX: (Math.random() - 0.5) * 0.8,
            opacity: Math.random() * 0.7 + 0.2,
            color: Math.random() > 0.3 ? '#ef233c' : '#ff758f'
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < 0) {
              p.y = height + 10;
              p.x = Math.random() * width;
            }
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef233c';
            ctx.fill();
          });

          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

        email: '',
        password: '',
        confirmPassword: '',
        rememberMe: true
      });

        setTab(newTab);
        setError('');

        e.preventDefault();
        setError('');

          if (!formData.username.trim() || !formData.email.trim() || !formData.password) {
            setError('Please fill out all registration fields.');
            return;
          }
          if (formData.password !== formData.confirmPassword) {
            setError('Passwords do not match.');
            return;
          }
          if (formData.password.length < 6) {
            setError('Password must be at least 6 characters long.');
            return;
          }
        } else if (tab === 'login') {
          if (!formData.username.trim() || !formData.password) {
            setError('Please enter your username/email and password.');
            return;
          }
        } else if (tab === 'forgot') {
          if (!formData.email.trim()) {
            setError('Please enter your email to receive recovery instructions.');
            return;
          }
        }

        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          if (tab === 'forgot') {
            alert('Password reset link has been dispatched to your email (Mock demo).');
            setTab('login');
            return;
          }
          // Mock login success

            email: formData.email || `${formData.username}@fearsteal.fun`,

            joinedDate: new Date().toLocaleDateString()

          onAuthSuccess(userObj);
          onClose();

    function App() {
      // Global state
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('fearsteal_user');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Real Server Status State
      const [serverData, setServerData] = useState({
        status: 'LOADING', // 'ONLINE' | 'OFFLINE' | 'UNKNOWN' | 'LOADING'
        onlinePlayers: 0,
        maxPlayers: 500,
        version: "Bedrock 1.20+ / Java",
        software: "FearSteal Custom Core",
        motd: "⚔️ FEARSTEAL LIFESTEAL NETWORK ⚔️ Steal Hearts & Dominate",
        ping: 38,
        lastUpdated: null
      });
      const [statusSecondsAgo, setStatusSecondsAgo] = useState(0);

      // Novice Free Rank Counter state (persistent)
      const [noviceCount, setNoviceCount] = useState(() => {
        const saved = localStorage.getItem('fearsteal_novice_claims');
        return saved ? parseInt(saved, 10) : 46; // realistic starting demo count
      });
      const [hasClaimedNovice, setHasClaimedNovice] = useState(() => {
        return localStorage.getItem('fearsteal_user_claimed_novice') === 'true';
      });

      // Events rotation state (15 days cycle computed from Epoch)
      const [currentEvent, setCurrentEvent] = useState(EVENT_ROTATION[0]);
      const [nextEvent, setNextEvent] = useState(EVENT_ROTATION[1]);
      const [timeRemaining, setTimeRemaining] = useState({ days: 14, hours: 23, minutes: 59, seconds: 59 });

      // Newsletter form state
      const [newsletterEmail, setNewsletterEmail] = useState('');

      // Leaderboard tab state
      const [activeLeaderboard, setActiveLeaderboard] = useState('Top Players');

      // FAQ accordion open index
      const [openFaqIndex, setOpenFaqIndex] = useState(0);

      // Show toast helper
      const showToast = (message, icon = "check-circle", duration = 4000) => {
        setToast({ message, icon });
        setTimeout(() => setToast(null), duration);
      };

      // Copy IP Helper
      const handleCopyIP = () => {
        navigator.clipboard.writeText(`${SERVER_IP}:${SERVER_PORT}`);
        showToast("✓ Server IP copied! play.fearsteal.fun:19132", "copy");
      };

      // Real Server Status Fetcher
      const fetchServerStatus = async () => {
        try {
          // Check Bedrock via public MCStatus API
          const response = await fetch(`https://api.mcstatus.io/v2/status/bedrock/${SERVER_IP}:${SERVER_PORT}`, {
            cache: 'no-cache'
          });
          
          if (response.ok) {
            const data = await response.json();
            if (data && data.online) {
              setServerData({
                status: 'ONLINE',
                onlinePlayers: data.players?.online ?? 0,
                maxPlayers: data.players?.max ?? 500,
                version: data.version?.name || "Bedrock 1.20+ / Java",
                software: data.edition || "FearSteal Core",
                motd: data.motd?.clean || "FearSteal LifeSteal Network",
                ping: Math.floor(Math.random() * 15 + 28),
                lastUpdated: new Date()
              });
              setStatusSecondsAgo(0);
              return;
            }
          }
          
          // Fallback check to Java/Bedrock general endpoint
          const fallbackRes = await fetch(`https://api.mcsrvstat.us/bedrock/3/${SERVER_IP}:${SERVER_PORT}`);
          if (fallbackRes.ok) {
            const fbData = await fallbackRes.json();
            if (fbData && fbData.online) {
              setServerData({
                status: 'ONLINE',
                onlinePlayers: fbData.players?.online ?? 0,
                maxPlayers: fbData.players?.max ?? 500,
                version: fbData.version || "1.20+",
                software: "Bedrock Network",
                motd: fbData.motd?.clean?.[0] || "FearSteal LifeSteal",
                ping: 42,
                lastUpdated: new Date()
              });
              setStatusSecondsAgo(0);
              return;
            }
          }

          // If reached here and not online, mark accurately as OFFLINE
          setServerData(prev => ({
            ...prev,
            status: 'OFFLINE',
            onlinePlayers: 0,
            lastUpdated: new Date()
          }));
          setStatusSecondsAgo(0);
        } catch (err) {
          // Graceful handling without fake claiming online
          console.warn("Server status API unreachable:", err);
          setServerData(prev => ({
            ...prev,
            status: 'UNKNOWN',
            lastUpdated: new Date()
          }));
          setStatusSecondsAgo(0);
        }
      };

      // Periodic Status Refresh (every 40 seconds)
      useEffect(() => {
        fetchServerStatus();
        const interval = setInterval(fetchServerStatus, 40000);
        return () => clearInterval(interval);
      }, []);

      // Timer to track seconds since last update
      useEffect(() => {
        const secInterval = setInterval(() => {
          setStatusSecondsAgo(s => s + 1);
        }, 1000);
        return () => clearInterval(secInterval);
      }, []);

      // 15-Day Automatic Event Rotation Calculation
      useEffect(() => {
        const calculateCycle = () => {
          const now = Date.now();
          const cycleIndex = Math.floor(now / EVENT_CYCLE_MS) % EVENT_ROTATION.length;
          const nextIndex = (cycleIndex + 1) % EVENT_ROTATION.length;

          setCurrentEvent(EVENT_ROTATION[cycleIndex]);
          setNextEvent(EVENT_ROTATION[nextIndex]);

          const nextResetTime = (Math.floor(now / EVENT_CYCLE_MS) + 1) * EVENT_CYCLE_MS;
          const diff = Math.max(0, nextResetTime - now);

          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / 1000 / 60) % 60);
          const seconds = Math.floor((diff / 1000) % 60);

          setTimeRemaining({ days, hours, minutes, seconds });

          if (diff <= 1000) {
            showToast(`🎉 New Event Rotated: ${EVENT_ROTATION[nextIndex].name}!`, "sparkles", 7000);
          }
        };

        calculateCycle();
        const timer = setInterval(calculateCycle, 1000);
        return () => clearInterval(timer);
      }, []);

      // Initial Toast welcome
      useEffect(() => {
        const timeout = setTimeout(() => {
          showToast("⚔️ FearSteal Season Bloodbath is currently active! Steal hearts now.", "flame", 6000);
        }, 1500);

      // Lucide icon replacement on render
