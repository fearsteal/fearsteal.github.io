<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | FearSteal</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth"><div class="auth-box"><img class="auth-logo" src="assets/logo.png" alt="FearSteal"><h1>Create Account</h1><p class="auth-sub">Join the FearSteal community</p><form id="registerForm"><div class="field"><label>Minecraft Username</label><input name="username" required placeholder="Your Minecraft username"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input name="password" type="password" required placeholder="Minimum 8 characters"></div><div class="field"><label>Confirm Password</label><input name="confirm" type="password" required placeholder="Repeat password"></div><label class="check"><input type="checkbox" required> I agree to the Terms and Rules</label><button class="btn primary full" type="submit">CREATE ACCOUNT</button></form><div id="message" class="message"></div><p style="text-align:center;color:var(--muted);margin-top:20px;font-size:14px">Already registered? <a class="small-link" href="login.html">Login</a></p></div></main><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
